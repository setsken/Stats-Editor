<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Payment cancelled — Stats Editor</title>
<!-- Served at /payment/cancel. See payment-success.html for why this is static. -->
<style>
  :root {
    --bg: #0b1020;
    --card: #131a30;
    --border: #23304f;
    --text: #eaf0ff;
    --muted: #93a2c4;
    --warn: #f0a33a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: radial-gradient(circle at 50% 0%, #17244a 0%, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .card {
    width: 100%;
    max-width: 440px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 32px;
    text-align: center;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
  }
  .mark {
    width: 72px;
    height: 72px;
    margin: 0 auto 24px;
    border-radius: 50%;
    background: rgba(240, 163, 58, .12);
    border: 1px solid rgba(240, 163, 58, .35);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  h1 { margin: 0 0 12px; font-size: 22px; font-weight: 600; letter-spacing: .2px; }
  p { margin: 0 0 16px; font-size: 15px; line-height: 1.6; color: var(--muted); }
  .note {
    margin: 24px 0 0;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    color: var(--muted);
  }
  strong { color: var(--text); font-weight: 600; }
</style>
</head>
<body>
  <main class="card">
    <div class="mark">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" stroke="#f0a33a" stroke-width="2.4"
              stroke-linecap="round"/>
      </svg>
    </div>

    <h1>Payment cancelled</h1>

    <p>You were not charged. Nothing was taken from your wallet.</p>
    <p>
      You can <strong>close this tab and return to Stats Editor</strong> to
      start the payment again whenever you are ready.
    </p>

    <p class="note">
      If you did send a transfer but see this page, do not pay again — contact
      support with the transaction hash.
    </p>
  </main>
</body>
</html>
