<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Authorize Profile Stats</title>
  <style>
    :root {
      --bg: #0b0d12;
      --bg2: #161922;
      --border: #2a2f3d;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      overflow: hidden;
    }
    .wrap { display: flex; flex-direction: column; padding: 24px; min-height: 100vh; }
    .header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .icon {
      display: inline-flex; align-items: center; justify-content: center;
      width: 44px; height: 44px; border-radius: 10px;
      background: rgba(139, 92, 246, 0.15); color: var(--accent);
    }
    h1 { font-size: 16px; font-weight: 600; }
    p { color: var(--muted); line-height: 1.55; margin-bottom: 10px; }
    .email {
      display: inline-block; padding: 4px 10px;
      background: var(--bg2); border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); font-size: 12px; font-weight: 500;
      margin: 4px 0 14px;
    }
    .scopes {
      margin-top: 4px; padding: 10px 12px;
      background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
      font-size: 12px; color: var(--muted);
    }
    .scopes li { margin-left: 16px; line-height: 1.6; }
    .actions { display: flex; gap: 8px; margin-top: auto; padding-top: 18px; }
    .btn {
      flex: 1; height: 38px; border: none; border-radius: 8px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: background 0.15s;
    }
    .btn-deny {
      background: transparent; border: 1px solid var(--border); color: var(--text);
    }
    .btn-deny:hover { background: var(--bg2); border-color: var(--danger); color: var(--danger); }
    .btn-allow { background: var(--accent); color: white; }
    .btn-allow:hover { background: var(--accent-hover); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" width="24" height="24" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2"/>
          <path d="M7 11V7a5 5 0 0110 0v4"/>
        </svg>
      </div>
      <h1>Authorize Profile Stats</h1>
    </div>
    <p><strong>Profile Stats</strong> wants to sign you in using your Stats Editor account:</p>
    <div class="email" id="email">—</div>
    <div class="scopes">
      It will receive:
      <ul>
        <li>Your auth token (read-only)</li>
        <li>Your email address</li>
      </ul>
    </div>
    <div class="actions">
      <button class="btn btn-deny" id="denyBtn">Deny</button>
      <button class="btn btn-allow" id="allowBtn">Allow</button>
    </div>
  </div>
  <script src="auth-confirm.js"></script>
</body>
</html>
